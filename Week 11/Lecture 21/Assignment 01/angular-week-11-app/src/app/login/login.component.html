<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card p-4 shadow">
      <h3 class="text-center mb-4"><strong>Login</strong></h3>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" formControlName="username" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Sign in</button>
      </form>

      <div *ngIf="errorMessage" class="text-danger text-center mt-3">
        {{ errorMessage }}
      </div>

      <div class="mt-3">
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </div>
    </div>
</div>
